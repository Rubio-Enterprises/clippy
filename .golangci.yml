# golangci-lint settings, owned by this repository (the standards package ships no Go config).
version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
