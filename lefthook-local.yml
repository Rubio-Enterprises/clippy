pre-commit:
  # Shared Fixer overlay (config/lefthook/README.md).
  jobs:
    - name: fixers
      group:
        jobs:
          - name: repo-scope
            exclude:
              - .goreleaser.yml
              - build-clib.sh
              - dev/**
              - gui/**
              - mcp-server-contribution.md
              - scripts/build-mcpb.sh
              - server.json
          - name: stage
            stage_fixed: false
  commands:
    shellcheck:
      exclude: "dev/**"
