name: Bump Homebrew Formula

"on":
  push:
    tags: ["v*-strubio.*"]

permissions:
  contents: read

jobs:
  bump:
    uses: Rubio-Enterprises/.github/.github/workflows/bump-brew.yml@427623d6179953834b50c1663facac001aed0700 # v4
    with:
      formula-name: clippy
    secrets:
      TAP_PUSH_APP_ID: ${{ secrets.TAP_PUSH_APP_ID }}
      TAP_PUSH_APP_PRIVATE_KEY: ${{ secrets.TAP_PUSH_APP_PRIVATE_KEY }}
