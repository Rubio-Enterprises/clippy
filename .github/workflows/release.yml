name: Bump Homebrew Formula

"on":
  push:
    tags: ["v*-strubio.*"]

permissions:
  contents: read

jobs:
  bump:
    uses: Rubio-Enterprises/.github/.github/workflows/bump-brew.yml@083a18b5fd4ae40bd54a67296c016fbf998ab7e5 # v3.8.0
    with:
      formula-name: clippy
    secrets:
      TAP_PUSH_APP_ID: ${{ secrets.TAP_PUSH_APP_ID }}
      TAP_PUSH_APP_PRIVATE_KEY: ${{ secrets.TAP_PUSH_APP_PRIVATE_KEY }}
